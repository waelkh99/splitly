name: splitly
description: "Ultra-fast offline-first bill splitter for iOS."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage
  hive_flutter: ^1.1.0

  # Image picker
  image_picker: ^1.1.2

  # Share
  share_plus: ^10.1.4

  # Localization
  intl: ^0.20.2

  # Utilities
  uuid: ^4.5.1

  # QR generation + scanning (group import/export)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3

  # Read app version at runtime
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/

  generate: true
